services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: akritas
      POSTGRES_USER: akritas
      POSTGRES_PASSWORD: akritas_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - akritas_postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akritas -d akritas"]
      interval: 5s
      timeout: 5s
      retries: 12

  akritas:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - app.env
    environment:
      AKRITAS_DATABASE_URL: postgresql://akritas:akritas_dev@postgres:5432/akritas?sslmode=disable
      AKRITAS_PUBLIC_URL: https://localhost:8443
      AKRITAS_ALLOWED_ORIGINS: https://localhost:8443,http://localhost:3000
      AKRITAS_SESSION_COOKIE_SECURE: "true"
      AKRITAS_SESSION_COOKIE_SAME_SITE: lax
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/auth/setup-status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      akritas:
        condition: service_healthy

volumes:
  akritas_postgres18_data:
  caddy_data:
  caddy_config:
