    MonitoringConfiguration:
      type: object
      additionalProperties: false
      required: [enabled, error_patterns, ignored_patterns, grouping_window, context_before, context_after]
      examples:
        - enabled: true
          error_patterns:
            - "database .* unavailable"
          ignored_patterns:
            - "expected healthcheck failure"
          grouping_window: PT30M
          context_before: 20
          context_after: 20
      properties:
        enabled:
          type: boolean
          default: false
        error_patterns:
          type: array
          maxItems: 100
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 500
          description: Additional regular expressions; they complement built-in rules.
        ignored_patterns:
          type: array
          maxItems: 100
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 500
          description: Regular expressions evaluated first and with absolute precedence.
        grouping_window:
          type: string
          format: duration
          default: PT30M
          pattern: "^P(?=.*[1-9])(?:(?:[0-9]+)D)?(?:T(?:(?:[0-9]+)H)?(?:(?:[0-9]+)M)?(?:(?:[0-9]+)S)?)?$"
        context_before:
          type: integer
          minimum: 0
          maximum: 1000
          default: 20
        context_after:
          type: integer
          minimum: 0
          maximum: 1000
          default: 20
