openapi: 3.1.0
info:
  title: Akritas API
  version: 1.4.0
  summary: Contract between the Akritas Go backend and its web frontend.
  description: |
    Public HTTP contract for the Akritas hackathon MVP.

    Akritas monitors Dokploy applications, detects and groups incidents with a
    deterministic engine, investigates them locally with QVAC, always creates a
    GitHub Issue after a completed investigation and may create a validated Pull
    Request. It never merges, deploys or rolls back automatically.

    JSON fields use snake_case. All timestamps are RFC 3339 UTC. Collection
    endpoints use signed cursor pagination. When `cursor` is supplied, filters,
    sorting and limit must not be sent again because they are encoded in the
    cursor.
  contact:
    name: Akritas maintainers
  license:
    name: Private hackathon project
servers:
  - url: /api/v1
    description: Same-origin API
security:
  - cookieAuth: []
tags:
  - name: Auth
  - name: System
  - name: Dashboard
  - name: Operations
  - name: GitHub
  - name: Dokploy
  - name: QVAC
  - name: Projects
  - name: Automation
  - name: Incidents
  - name: Investigations
  - name: Remediations
  - name: PullRequests

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /readiness:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Readiness probe without sensitive dependency details
      security: []
      responses:
        "200":
          description: The API can accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: The API is alive but not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /auth/setup-status:
    get:
      tags: [Auth]
      operationId: getAuthSetupStatus
      summary: Check whether first-administrator setup is still available
      security: []
      responses:
        "200":
          description: Safe setup state. It does not reveal administrator identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/setup:
    post:
      tags: [Auth]
      operationId: startAdministratorSetup
      summary: Start the one-time administrator and TOTP enrollment
      description: |
        Validates the bootstrap token supplied through deployment configuration,
        creates a short-lived pending enrollment and returns TOTP provisioning
        data exactly once. The bootstrap token never becomes the TOTP seed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Pending enrollment created.
          headers:
            Cache-Control:
              description: Prevent storage of TOTP provisioning material.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/setup/verify:
    post:
      tags: [Auth]
      operationId: verifyAdministratorSetup
      summary: Verify TOTP and activate the only administrator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpEnrollmentVerificationRequest"
      responses:
        "200":
          description: Administrator activated and session created.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [Auth]
      operationId: loginAdministrator
      summary: Authenticate with email, password and TOTP
      description: Invalid credentials always produce the same safe error response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session created.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/session:
    get:
      tags: [Auth]
      operationId: getCurrentSession
      summary: Get the authenticated administrator session
      responses:
        "200":
          description: Current safe session projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Auth]
      operationId: logoutAdministrator
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked and cookie expired.
          headers:
            Set-Cookie:
              description: Expired HttpOnly session cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/recovery:
    post:
      tags: [Auth]
      operationId: startAdministratorRecovery
      summary: Start password and TOTP recovery using the deployment bootstrap token
      description: The response is generic if the administrator email does not match.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRequest"
      responses:
        "201":
          description: Pending recovery enrollment created.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/recovery/verify:
    post:
      tags: [Auth]
      operationId: verifyAdministratorRecovery
      summary: Confirm the replacement TOTP and revoke all previous sessions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpEnrollmentVerificationRequest"
      responses:
        "200":
          description: Recovery completed and a fresh session created.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /system/status:
    get:
      tags: [System]
      operationId: getSystemStatus
      summary: Get safe integration and worker status for Settings
      responses:
        "200":
          description: Current status projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /system/diagnostics:
    post:
      tags: [System, Operations]
      operationId: runSystemDiagnostics
      summary: Queue safe diagnostics for configured dependencies
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /overview:
    get:
      tags: [Dashboard]
      operationId: getProductionOverview
      summary: Get dashboard counts and active investigation projections
      responses:
        "200":
          description: Dashboard overview. Completed means workflow completed, not production resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /activity:
    get:
      tags: [Dashboard]
      operationId: listActivity
      summary: List sanitized operational activity
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
        - name: project_id_eq
          in: query
          schema:
            type: string
            format: uuid
        - name: incident_id_eq
          in: query
          schema:
            type: string
            format: uuid
        - name: type_in
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ActivityType"
          style: form
          explode: false
      responses:
        "200":
          description: Cursor-paginated activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /operations/{operation_id}:
    parameters:
      - name: operation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Poll a queued or running command
      responses:
        "200":
          description: Operation state and safe result reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /integrations/github/accounts:
    get:
      tags: [GitHub]
      operationId: listGitHubAccounts
      summary: List configured GitHub accounts and installations
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
        - name: authentication_status_in
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IntegrationStatus"
          style: form
          explode: false
      responses:
        "200":
          description: Cursor-paginated safe account projections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubAccountListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [GitHub]
      operationId: createGitHubPatAccount
      summary: Connect a GitHub personal or organization account with a PAT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGitHubPatAccountRequest"
      responses:
        "201":
          description: PAT validated, encrypted and associated with the account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubAccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /integrations/github/accounts/{account_id}:
    parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [GitHub]
      operationId: getGitHubAccount
      summary: Get a safe GitHub account projection
      responses:
        "200":
          description: GitHub account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubAccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [GitHub]
      operationId: updateGitHubAccount
      summary: Update display data or rotate a PAT
      description: GitHub App generated credentials cannot be returned or replaced here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGitHubAccountRequest"
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubAccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [GitHub]
      operationId: deleteGitHubAccount
      summary: Remove an unreferenced GitHub integration
      description: Returns conflict while any Project references this account.
      responses:
        "204":
          description: Account and encrypted credentials removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /integrations/github/accounts/{account_id}/connection-test:
    parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [GitHub]
      operationId: testGitHubConnection
      summary: Test GitHub authentication without returning provider errors
      responses:
        "200":
          description: Normalized test result; an invalid credential is represented as a failed result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /integrations/github/accounts/{account_id}/repositories:
    parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [GitHub]
      operationId: listGitHubRepositories
      summary: Discover repositories accessible through the configured account
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: name_like
          in: query
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Cursor-paginated repositories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepositoryListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /integrations/github/app-manifest/registrations:
    post:
      tags: [GitHub]
      operationId: startGitHubAppManifestRegistration
      summary: Create a one-time GitHub App Manifest registration handoff
      description: |
        Returns the GitHub form action, JSON manifest and unpredictable state.
        The browser submits them directly to GitHub. The registration must be
        completed within one hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubManifestRegistrationRequest"
      responses:
        "201":
          description: One-time registration handoff.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubManifestRegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /integrations/github/app-manifest/callback:
    get:
      tags: [GitHub]
      operationId: completeGitHubAppManifestRegistration
      summary: Exchange the GitHub manifest code and redirect to installation
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 20
            maxLength: 255
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 512
      responses:
        "303":
          description: Generated app secrets encrypted; redirect to the GitHub installation URL.
          headers:
            Location:
              $ref: "#/components/headers/RedirectLocation"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /integrations/github/app-installations/callback:
    get:
      tags: [GitHub]
      operationId: completeGitHubAppInstallation
      summary: Validate an installation and redirect back to GitHub Settings
      description: The installation ID is verified with app authentication and is never trusted by itself.
      security: []
      parameters:
        - name: installation_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: setup_action
          in: query
          required: false
          schema:
            type: string
            enum: [install, update]
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 512
      responses:
        "303":
          description: Installation persisted; redirect to the frontend GitHub Settings page.
          headers:
            Location:
              $ref: "#/components/headers/RedirectLocation"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /integrations/dokploy/servers:
    get:
      tags: [Dokploy]
      operationId: listDokployServers
      summary: List configured Dokploy servers
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
        - name: connection_status_in
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IntegrationStatus"
          style: form
          explode: false
      responses:
        "200":
          description: Cursor-paginated servers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DokployServerListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Dokploy]
      operationId: createDokployServer
      summary: Configure and validate a Dokploy server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDokployServerRequest"
      responses:
        "201":
          description: Server configured with encrypted credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DokployServerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /integrations/dokploy/servers/{server_id}:
    parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Dokploy]
      operationId: getDokployServer
      summary: Get a safe Dokploy server projection
      responses:
        "200":
          description: Dokploy server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DokployServerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Dokploy]
      operationId: updateDokployServer
      summary: Update server metadata or rotate its credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDokployServerRequest"
      responses:
        "200":
          description: Updated server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DokployServerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Dokploy]
      operationId: deleteDokployServer
      summary: Remove an unreferenced Dokploy server
      description: Returns conflict while any Project references this server.
      responses:
        "204":
          description: Server and encrypted credential removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /integrations/dokploy/servers/{server_id}/connection-test:
    parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Dokploy]
      operationId: testDokployConnection
      summary: Test Dokploy connectivity with a normalized result
      responses:
        "200":
          description: Connection test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /integrations/dokploy/servers/{server_id}/applications:
    parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Dokploy]
      operationId: listDokployApplications
      summary: Discover applications available on a configured Dokploy server
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: name_like
          in: query
          schema:
            type: string
            maxLength: 200
