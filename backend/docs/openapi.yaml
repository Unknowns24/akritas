components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: akritas_session
      description: |
        Opaque server-side session cookie. Production uses Secure, HttpOnly,
        SameSite=Lax and Path=/. The value is never exposed to JavaScript.

  headers:
    SessionCookie:
      description: Secure HttpOnly opaque session cookie; no token is returned in JSON.
      schema:
        type: string
        example: akritas_session=opaque; Path=/; Secure; HttpOnly; SameSite=Lax
    NoStore:
      description: Prevent caching of credentials or provisioning material.
      schema:
        type: string
        const: no-store
    RedirectLocation:
      description: Validated GitHub or same-origin frontend redirect.
      schema:
        type: string
        format: uri
    RetryAfter:
      description: Suggested number of seconds before polling again.
      schema:
        type: integer
        minimum: 1
        maximum: 60

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size for an initial request. Omit when cursor is present.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Signed cursor returned by the API. Send it without filters, sort or limit.
      schema:
        type: string
        minLength: 16
        maxLength: 4096
    Sort:
      name: sort
      in: query
      description: Comma-separated field:direction list for an initial request.
      schema:
        type: string
        maxLength: 200
        example: created_at:desc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID retained for safe command retries.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Malformed input or validation failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is missing, expired or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated request is rejected by Origin or deployment policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource state or invariant prevents the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit reached. The response does not reveal which bucket was exceeded.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Safe internal error without provider or infrastructure details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    OperationAccepted:
      description: Command persisted and queued for asynchronous execution.
