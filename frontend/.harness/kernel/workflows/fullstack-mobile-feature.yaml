name: fullstack-mobile-feature

mode_support:
    - existing_project
    - new_project

steps:
    - id: backend_contract_first
      workflow: backend-api-feature
      note: Backend/OpenAPI must be defined before mobile implementation.

    - id: mobile_from_openapi
      workflow: mobile-flutter-feature
      note: Flutter app must consume the updated OpenAPI contract and must not invent endpoints.
