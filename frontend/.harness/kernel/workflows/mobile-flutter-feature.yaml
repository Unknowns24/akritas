name: mobile-flutter-feature
mode_support:
  - existing_project
  - new_project
steps:
  - id: analyze_task
    agent: orchestrator
    output: implementation-brief.md
  - id: design_tests
    agent: mobile-flutter-tdd
    output: tdd-test-plan.md
    human_gate: approval_required
  - id: implement
    agent: mobile-flutter-implementer
    requires:
      - human_approved_tdd_plan
  - id: verify
    commands:
      - flutter analyze
      - flutter test
      - .harness/kernel/scripts/check-flutter-architecture.sh
      - .harness/kernel/scripts/check-openapi.sh
      - .harness/kernel/scripts/check-security.sh
  - id: architecture_review
    agent: architecture-reviewer
    output: architecture-review.md
  - id: security_review
    agent: security-reviewer
    output: security-review.md
  - id: summarize
    agent: context-curator
    output: final-summary.md
